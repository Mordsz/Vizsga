<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regisztráció</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/Logo.png" type="image/png">
</head>

<body>

<div class="box register-box">
  <h2>Regisztráció</h2>

  <div id="error-message" class="message error" style="display:none;"></div>

  <form action="php/register_process.php" method="POST">
    <input name="first_name" placeholder="Keresztnév" required>
    <input name="last_name" placeholder="Vezetéknév" required>
    <input name="username" placeholder="Felhasználónév" required>
    <input name="email" type="email" placeholder="Email cím" required>
    <div class="password-wrapper">
      <input name="password" type="password" placeholder="Jelszó" required id="passwordField">
      <button type="button" class="toggle-password" id="togglePassword1">👁️‍🗨️</button>
    </div>
    <div class="password-wrapper">
      <input name="password_confirm" type="password" placeholder="Jelszó megerősítése" required id="passwordConfirmField">
      <button type="button" class="toggle-password" id="togglePassword2">👁️‍🗨️</button>
    </div>

    <button type="submit">Regisztráció</button>
    <button type="button" class="back-btn" onclick="window.location.href='index.html'">← Vissza</button>
  </form>
</div>

<script src="data/Register.js"></script>
</body>
</html>
